services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    environment:
      PRESIDENT_API_TARGET: http://backend:8080
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - ./data/presidency-scores.stage-2.json:/data/presidency-scores.stage-2.json:ro
      - ./data/presidency-assessments.stage-2.json:/data/presidency-assessments.stage-2.json:ro
      - ./data/historical-events.stage-1.json:/data/historical-events.stage-1.json:ro
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/eslint.config.js:/app/eslint.config.js
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-president_archive}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-archive}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-president_archive}
      MYSQL_USER: ${MYSQL_USER:-archive}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
